name: Keep Supabase awake

# Free Supabase projects pause after a week without any requests, and a
# paused database would leave visitors on the slow iNaturalist fallback.
# Asking it for an animal twice a week keeps it awake between visits.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ask the database for an animal
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The public, read-only key the site itself uses. Never the secret key.
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as repository secrets."
            exit 1
          fi

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/rest/v1/rpc/random_animal" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"exclude_ids": []}')

          echo "Supabase answered $status"
          test "$status" = 200
